<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TGC</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--fg:#222;--card:#fff;--ac:#e8590c;--mu:#888;--bd:#e5e0d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b1a;--fg:#eee;--card:#2a2928;--ac:#ff922b;--mu:#a09a94;--bd:#3d3b39}}
:root[data-theme="dark"]{--bg:#1c1b1a;--fg:#eee;--card:#2a2928;--ac:#ff922b;--mu:#a09a94;--bd:#3d3b39}
*{box-sizing:border-box}
[hidden]{display:none!important}
.w{max-width:480px;margin:0 auto;padding:8px 12px}
h1{font-size:18px;margin:2px 0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;margin-bottom:8px}
button,input{font:inherit;border-radius:10px;border:1px solid var(--bd);padding:10px 14px;background:var(--card);color:var(--fg)}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button.on{outline:3px solid var(--ac)}
button:disabled{opacity:.4}
#cw{position:relative;width:min(100%,36vh);margin:0 auto}
#cov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#e9e4dc;color:#555;font-weight:600;border-radius:10px;padding:10px}
canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:10px;border:1px solid var(--bd);touch-action:none;display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=color]{padding:0;width:44px;height:40px}
input[type=range]{padding:0;flex:1;min-width:80px}
#st{font-size:16px;font-weight:600;min-height:24px}
#tm{font-size:22px;font-weight:700;color:var(--ac)}
#log{max-height:140px;overflow-y:auto;font-size:14px}
#log div{padding:2px 0}
.mu{color:var(--mu);font-size:13px}
#sb div{display:flex;justify-content:space-between;padding:3px 0}

[hidden]{display:none!important}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#app,#ov,#tt{--s1:#1a1b1f;--s2:#26282d;--sm:#9fa3ab;--ac:#335fff;--bd:#2f3136;color:#fff;--fg:#fff;--card:#1a1b1f;--mu:#9fa3ab}
#app{position:fixed;inset:0;display:flex;background:linear-gradient(rgba(var(--bgc,14,15,18),var(--bga,1)),rgba(var(--bgc,14,15,18),var(--bga,1))),#000;padding-top:env(safe-area-inset-top,0)}
#nav{width:74px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;flex:none}
.ni{width:64px;padding:8px 0;border-radius:12px;text-align:center;font-size:12px;cursor:pointer;color:#cfd2d8;position:relative}
.ni b{display:block;font-size:24px;line-height:30px;font-weight:400}
.ni.on{background:var(--s2);color:#fff}.ni i{position:absolute;top:6px;right:12px;width:10px;height:10px;border-radius:50%;background:#f03e3e}
.ni svg{width:30px;height:38px;border-radius:50%;background:#2c2f36;display:block;margin:0 auto}
#mn{flex:1;min-width:0;display:flex;flex-direction:column}
#hd{display:flex;align-items:center;gap:14px;padding:12px 18px}
.logo{font-weight:900;font-size:26px;letter-spacing:1px;background:linear-gradient(90deg,#ff6b6b,#fcc419,#4dabf7);-webkit-background-clip:text;background-clip:text;color:transparent}
#hd input{flex:1;min-width:0;background:var(--s1);border:0;border-radius:12px;color:#fff;padding:12px 16px;font-size:16px}
#pg{flex:1;overflow:auto;padding:4px 18px 24px}
h2{font-size:22px;margin:18px 0 12px}
.me{display:flex;align-items:center;gap:14px;margin:6px 0}.me .ci{width:56px;height:56px}
.ci{border-radius:50%;overflow:hidden;background:var(--s2);flex:none;position:relative}.ci svg{width:100%;height:100%;display:block}
.fr{display:flex;gap:16px;overflow-x:auto;padding-bottom:8px}
.fc{width:96px;flex:none;text-align:center;font-size:13px;cursor:pointer}.fc .ci{width:92px;height:92px;margin:0 auto 6px}
.fc small{display:block;color:var(--sm);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc{position:relative}.dot{position:absolute;right:8px;top:66px;width:16px;height:16px;border-radius:50%;background:#2fbf71;border:3px solid #0e0f12}
.fc.add .ci{display:flex;align-items:center;justify-content:center;font-size:34px;color:#cfd2d8}
.b{background:var(--s2);border:0;color:#fff;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer}.b.pr{background:var(--ac)}.b.sm{padding:5px 10px;font-size:12px;margin-top:4px}.b.dn{color:#ff8787}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gc{cursor:pointer}.gt{aspect-ratio:1.6;border-radius:14px;background:linear-gradient(135deg,#ff922b,#e64980 55%,#7048e8);display:flex;align-items:center;justify-content:center;font-size:72px}
.gc b{display:block;margin-top:8px;font-size:17px}.gc span{color:var(--sm);font-size:13px}
.card2{background:var(--s1);border-radius:14px;padding:14px;margin-bottom:12px}
.card2 input,.dlg input{width:100%;box-sizing:border-box;background:var(--s2);border:0;border-radius:10px;color:#fff;padding:12px;font-size:16px;margin:6px 0}
table{width:100%;border-collapse:collapse}td,th{padding:12px 8px;text-align:left;border-bottom:1px solid var(--bd)}
.chat{display:flex;gap:12px;height:calc(100% - 4px)}#cl{width:240px;flex:none;overflow:auto}#cp{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--s1);border-radius:14px;padding:12px}
.cv{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}.cv.on{background:var(--s2)}.cv .ci{width:44px;height:44px}.cv small{display:block;color:var(--sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#cm{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px}.mg{max-width:75%;padding:8px 12px;border-radius:14px;background:var(--s2);align-self:flex-start;word-break:break-word}.mg.me2{background:var(--ac);align-self:flex-end}
.wd{display:flex;gap:14px;height:100%}#wl{flex:1;min-width:0;overflow:auto}#wr{width:36%;flex:none;border-radius:14px;overflow:hidden;position:relative;background:#2a2b30;display:flex;align-items:center;justify-content:center}#wr .big{height:100%;width:100%}#wr svg.av{height:92%;width:auto}
.seg{display:inline-flex;background:var(--s2);border-radius:20px;padding:3px}.seg span{padding:6px 14px;border-radius:16px;cursor:pointer;font-size:14px}.seg .on{background:#3a3d44}
.tabs{display:flex;gap:18px;overflow-x:auto;margin:10px 0;border-bottom:1px solid var(--bd)}.tabs span{padding:8px 2px;cursor:pointer;white-space:nowrap;color:var(--sm)}.tabs .on{color:#fff;border-bottom:3px solid #fff}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.it{cursor:pointer;font-size:13px}.it .th{aspect-ratio:1;background:var(--s2);border-radius:12px;overflow:hidden;border:2px solid transparent}.it.on .th{border-color:#4dabf7}.it svg{width:100%;height:100%}.it small{color:var(--sm);display:block}
.un{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:8px}.un button{width:44px;height:44px;border-radius:50%;border:0;background:#1c1d21cc;color:#fff;font-size:20px}
#ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;overflow:auto}
.dlg{background:#1e2025;border-radius:16px;padding:18px;width:min(92vw,360px)}.dlg h3{margin:0 0 8px}.dlg .row{display:flex;gap:8px;margin-top:10px}.dlg .row .b{flex:1}
.prof{width:min(96vw,460px);background:#121316;border-radius:18px;overflow:hidden;max-height:94vh;overflow-y:auto;position:relative}
.ph{height:300px;position:relative;display:flex;justify-content:center}.ph svg.av{height:100%;width:auto}.ph .x{position:absolute;left:12px;top:12px;width:40px;height:40px;border-radius:50%;background:#000c;border:0;color:#fff;font-size:20px;z-index:2}
.pi{display:flex;gap:12px;align-items:center;padding:12px 16px}.pi .ci{width:84px;height:84px;margin-top:-34px;border:4px solid #121316}
.chips{display:flex;gap:8px;padding:0 16px;flex-wrap:wrap}.chips span{background:var(--s2);border-radius:20px;padding:8px 14px;font-size:14px}
.pb{display:flex;gap:10px;padding:14px 16px;position:relative}.pb .b{flex:1;padding:14px}.mn{position:absolute;right:16px;bottom:64px;background:#1e2025;border-radius:12px;padding:6px;z-index:3}.mn div{padding:12px 16px;cursor:pointer;white-space:nowrap}
.wear{display:flex;gap:10px;overflow-x:auto;padding:0 16px 14px}.wear .it{width:130px;flex:none}
.pc{border:1px solid var(--bd);border-radius:14px;padding:12px;margin:0 16px 8px;display:flex;gap:12px;align-items:center}
#tt{position:fixed;right:12px;top:12px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(92vw,340px)}
.toast{background:#2a2c31;border-radius:12px;padding:12px 14px;box-shadow:0 4px 18px #000a}
#gscr{position:fixed;inset:0;z-index:30;overflow:auto;background:var(--bg,#faf7f2);color:var(--fg,#222)}
#gtop{display:flex;align-items:center;gap:10px;padding:8px 12px;position:sticky;top:0;background:#ffffffee;z-index:5;border-bottom:1px solid #e5e0d8;color:#222}
#gtop button{background:#fff;color:#222;border:1px solid #ddd;border-radius:10px;padding:8px 12px}
#wait{max-width:520px;margin:0 auto;padding:16px;color:#222}#wait .rn{font-size:40px;font-weight:800;letter-spacing:4px;color:#e8590c}
.pl{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0}.pl .fc{color:#222}.pl .fc small{color:#777}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes bn{0%,100%{transform:translateY(0)}30%{transform:translateY(-12px)}}
g.an1{animation:fl 2.2s ease-in-out infinite}g.an2{animation:sw 1.8s ease-in-out infinite;transform-origin:50% 90%}g.an3{animation:bn 1s ease-in-out infinite}
g.an1,g.an2,g.an3{transform-box:fill-box;transform-origin:center}
@media(max-width:700px){#nav{width:58px}.ni{width:52px;font-size:11px}.chat{flex-direction:column}#cl{width:auto;max-height:130px}.wd{flex-direction:column-reverse}#wr{width:auto;height:260px}}

.a3{perspective:900px;position:relative;touch-action:none;cursor:grab}.rig{position:absolute;left:50%;top:40px;transform-style:preserve-3d}.cb{position:absolute;left:0;top:0;transform-style:preserve-3d}.cb>div{position:absolute;backface-visibility:hidden}.cb>div i{position:absolute;top:13px;width:4px;height:7px;background:#222;border-radius:2px}.cb>div u{position:absolute;left:11px;top:25px;width:14px;height:6px;border-bottom:2px solid #222;border-radius:0 0 10px 10px}
.lay{position:fixed;inset:0;overflow:auto;background:#0e0f12;color:#fff;padding-top:env(safe-area-inset-top,0)}.lg{font-size:56px;font-weight:900;text-align:center;margin:40px 0 50px;letter-spacing:4px}.ar{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}.ar small{display:block;color:#9fa3ab}.aa{width:52px;height:52px;border-radius:50%;background:#2c2f36;overflow:hidden;flex:none}.aa svg{width:100%;height:100%}.tg{background:#33353d;border-radius:6px;padding:6px 10px;font-size:14px;color:#c9ccd3}.ck{width:28px;height:28px;border-radius:50%;background:#d0d3d9;color:#222;text-align:center;line-height:28px}.xb{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer}.dh{display:flex;align-items:center;justify-content:space-between;padding:4px 0 10px}.dh b{font-size:20px}.acd{max-height:88vh;overflow:auto;background:#1a1b20}.b.wide{display:block;width:100%;margin-top:10px;padding:16px;background:#31323b}.ob{display:block;width:100%;margin-top:10px;padding:14px;background:none;border:1px solid #cfd2d8;border-radius:12px;color:#fff}.ob2{background:none!important;border:1px solid #cfd2d8!important}.b.wt{background:#f7f7f9;color:#111}.fm{max-width:480px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:12px}.fm input,.cc input,.inp{width:100%;background:#111216;border:0;color:#fff;border-radius:10px;padding:14px;font-size:16px;margin:0}.b.lb{width:100%;background:#335fff;color:#fff;padding:16px}.b.lb:disabled{opacity:.45}
.cc{position:absolute;left:50%;top:6%;transform:translateX(-50%);width:min(94vw,520px);background:#252830;border-radius:14px;overflow:hidden;max-height:90%;overflow-y:auto}.lbl{color:#c9ccd3;margin:12px 0 6px;font-size:14px}.gb{flex:1;background:#1a1b20;border:1px solid #cfd2d8;color:#fff;border-radius:10px;padding:14px;font-size:20px}.gb.on{background:#335fff}.cc .b.lb{margin:28px 0 10px}.cc .row{display:flex}
.wh{position:relative;display:flex;height:240px;margin:0 16px}.wc{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;text-align:center}.wc::-webkit-scrollbar{display:none}.wi{height:48px;line-height:48px;scroll-snap-align:start;color:#9fa3ab}
.wp{height:96px;flex:none}.wi.sel{color:#fff;font-weight:700;font-size:20px}.wc{overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}.wi{cursor:pointer;user-select:none}.wb{position:absolute;left:0;right:0;top:96px;height:48px;border-top:1px solid #4b5160;border-bottom:1px solid #4b5160;pointer-events:none;background:#ffffff0d}
.hud{position:absolute;z-index:2;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:max-content;max-width:94vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-weight:600;font-size:10px;color:#fff;background:#000a;border-radius:12px;padding:3px 8px;pointer-events:none}.dead{position:absolute;z-index:4;inset:0;background:#000a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}.dead[hidden]{display:none}
button.b.dn,.b.dn{color:#ff8787}select{font:inherit}

.stb{position:absolute;left:8px;right:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ar .ci,.pc .ci{width:44px;height:44px}.ar .ci svg{width:100%;height:100%}
@media (max-width:500px){.gr{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}.gc{padding:0!important}.gt{font-size:26px!important;aspect-ratio:2!important;border-radius:10px!important}.gc b{font-size:11px!important;margin-top:4px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.gc span{font-size:10px!important}}
</style></head><body>
<div id="app"><nav id="nav"></nav><section id="mn"><header id="hd"><div class="logo">TGC</div><input id="gq" placeholder="搜索游戏名字"><div id="hr"></div></header><div id="pg"></div></section></div>
<div id="ov" hidden></div><div id="tt"></div>
<div id="gscr" hidden><div id="gtop"><button id="gback">‹ 返回大厅</button><b id="rno"></b></div><div id="wait"></div><div class="w"><div id="game" hidden>
  <div class="card"><div class="row" style="justify-content:space-between"><div id="st"></div><div id="tm"></div></div><div class="mu" id="sub"></div></div>
  <div id="cw"><canvas id="cv" width="360" height="360"></canvas><div id="cov">✏️ 画手正在作画…<br>提交后才能开始猜</div></div>
  <div id="as" class="mu" style="min-height:18px;text-align:center;margin-top:4px"></div>
  <div class="card row" id="tools" style="margin-top:10px" hidden>
    <input type="color" id="col" value="#222222">
    <input type="range" id="wd" min="2" max="30" value="6">
    <div class="row" style="width:100%"><input id="an" maxlength="10" placeholder="输入物品名，AI帮你画（留空=当前题目）" style="flex:1;min-width:0"><button class="p" id="ab">✨ 帮我画</button><label class="mu"><input type="checkbox" id="fine" checked style="width:auto"> 精细（画得好，较慢）</label></div>
    <button id="und">↩️ 撤回</button><button id="red">↪️ 返撤</button><button id="fl">🪣 填色</button><button id="er">🧽 橡皮</button><button id="clr">清空</button><button class="p" id="ok">✅ 提交</button><button id="skip">放弃</button>
  </div>
  <div class="row" style="margin:10px 0">
    <button class="p" id="draw">我来画</button>
    <button id="aid">🤖 让AI画</button>
    <button id="pm" hidden>🔑 授权 Claude 看图</button>
    <label id="aiw" class="mu"><input type="checkbox" id="ai" checked style="width:auto"> AI 来猜</label>
  </div>
  <div id="pk" class="card" hidden><div class="mu">选分类，再选一个来画：</div><div id="pcat" class="row" style="margin:6px 0"></div><div id="pw" class="row" style="margin:6px 0"></div>
  <div class="row"><input id="pc" maxlength="8" placeholder="或自己出题（词语/数字）" style="flex:1;min-width:0"><button class="p" id="pg">开始</button></div>
  <div class="row" style="margin-top:6px"><button id="pr">🔄 换一批</button><button id="px">取消</button></div></div>
  <div class="row" style="margin-bottom:10px"><input id="gs" placeholder="输入答案…" style="flex:1;min-width:0"><button id="sg">猜</button></div>
  <div class="card"><div class="mu">猜测记录</div><div id="log"></div></div>
  <div class="card"><div class="mu">玩家积分</div><div id="sb"></div></div>
